nav:
  # Navigation bar logo image
  # logo: ./source/assets/img/sites/clash-cat.png
  logo: https://avatars.githubusercontent.com/u/149575179?s=40&v=4
  display_title: true
  display_post_title: true
  # Whether to fix navigation bar
  fixed: true
menu:
  Home: / || fas fa-home
  TimeLine: /archives/ || fas fa-archive
  Tags: /tags/ || fas fa-tags
  Categories: /categories/ || fas fa-folder-open
  Links: /link/ || fas fa-link
  About: /about/ || fas fa-heart
code_blocks:
  # Code block theme: darker / pale night / light / ocean / false
  theme: pale night
  macStyle: false
  # Code block height limit (unit: px)
  height_limit: 350
  word_wrap: true

  # Toolbar
  copy: true
  language: true
  # true: shrink the code blocks | false: expand the code blocks | none: expand code blocks and hide the button
  shrink: false
  # highlight_shrink: false
  fullpage: false
social:
  fab fa-github: https://github.com/Leakbox258 || Github || "#hdhfbb"
  fab fa-bilibili: https://space.bilibili.com/357341955 || Bilibili || "#000000"
avatar:
  img: https://avatars.githubusercontent.com/u/149575179?s=40&v=4
  effect: true
background: ./assets/img/sites/CIV6.jpg
default_top_img: ./assets/img/sites/CIV6.jpg
disable_top_img: false
share:
  # Choose: sharejs / addtoany
  # Leave it empty if you don't need share
  use: sharejs
comments:
  # Choose: Disqus/Disqusjs/Livere/Gitalk/Valine/Waline/Utterances/Facebook Comments/Twikoo/Giscus/Remark42/Artalk
  # Format of two comments system : Disqus,Waline
  use: Gitalk
  text: true
  lazyload: false
  # Display comment count in post's top_img
  count: true
  # Display comment count in Home Page
  card_post_count: true
